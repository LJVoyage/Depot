<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unity 项目浏览器</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
<!-- 主容器 -->
<div class="file-explorer" name="file-explorer">
    <!-- 视图切换（radio 需位于 toolbar / main-body 之前，供 CSS 兄弟选择器使用） -->
    <input type="radio" name="view" id="view-grid" class="view-radio" checked />
    <input type="radio" name="view" id="view-list" class="view-radio" />

    <!-- 标题栏 -->
    <div class="title-bar" name="title-bar">
        <span class="window-icon" name="window-icon">📁</span>
        <span class="window-title" name="window-title">Unity 项目浏览器</span>
        <span class="window-controls" name="window-controls">
                <span class="btn-min"></span>
                <span class="btn-max"></span>
                <span class="btn-close"></span>
            </span>
    </div>

    <!-- 标签栏（由 renderTabs 动态渲染） -->
    <div class="tab-bar" id="tabBar" name="tab-bar"></div>

    <!-- 工具栏 -->
    <div class="toolbar" name="toolbar">
            <span class="nav-buttons" name="nav-buttons">
                <button id="btnBack" title="后退">◀</button>
                <button id="btnUp" title="上级目录">⬆</button>
            </span>
        <span class="address-bar" name="address-bar">
                <span class="path-icon">📂</span>
                <span class="path-segments" id="pathSegments"></span>
            </span>
        <span class="view-buttons" name="view-buttons">
                <label for="view-grid" class="btn-grid active" title="网格视图">▦</label>
                <label for="view-list" class="btn-list" title="列表视图">☰</label>
            </span>
        <span class="mode-toggle" name="mode-toggle">映射模式
                <input type="checkbox" id="modeSwitch" />
            </span>
    </div>

    <!-- 主体 -->
    <div class="main-body" name="main-body">
        <!-- 侧边栏（由 renderSidebar 动态渲染） -->
        <div class="sidebar" name="sidebar">
            <div class="section-title" id="sidebarTitle" name="section-title">📌 快速访问</div>
            <ul id="sidebarItems" name="sidebar-items"></ul>
        </div>

        <!-- 内容区域 -->
        <div class="content-area" name="content-area">
            <!-- 列表头 -->
            <div class="list-header" name="list-header">
                <span class="col-name" name="col-name-header">名称</span>
                <span class="col-date" name="col-date-header">修改日期</span>
                <span class="col-size" name="col-size-header">大小</span>
            </div>

            <!-- 文件列表（由 renderFileList 动态渲染） -->
            <div class="file-list-container" id="fileListContainer" name="file-list-container">
                <div id="fileListContent"></div>
            </div>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" name="status-bar">
            <span class="status-left" name="status-left">
                <span id="statusCount"></span>
                <span id="statusSelected"></span>
            </span>
        <span class="status-right" name="status-right">
                <span id="statusPath"></span>
            </span>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu" name="context-menu" style="display:none;">
        <div class="menu-item" name="menu-new-file" data-action="new-file">📄 创建文件</div>
        <div class="menu-item" name="menu-new-folder" data-action="new-folder">📁 创建文件夹</div>
        <div class="menu-divider" name="menu-divider"></div>
        <div class="menu-item" name="menu-open-tab" data-action="open-tab">🔗 新标签页打开</div>
    </div>
</div>

<script src="./script.js"></script>
</body>
</html>
